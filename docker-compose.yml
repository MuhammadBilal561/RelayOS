# Self-hosted n8n (Community Edition — free, MIT-ish sustainable use license,
# no paid execution limits) for the RelayOS automation layer.
#
# Local test run:
#   docker compose up -d
#   open http://localhost:5678
#
# For a real, always-on deployment, run this same file on a free-tier VM
# (e.g. an Oracle Cloud "Always Free" ARM instance) instead of n8n Cloud —
# see the README's Phase 4 section for the full walkthrough.
#
# After it's running: create one workflow per file in ../automations/*.json
# (Workflows → Import from File), each starting with a Webhook trigger node,
# then copy that webhook's Production URL into RelayOS's Settings page.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false # set true once you're behind HTTPS
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
