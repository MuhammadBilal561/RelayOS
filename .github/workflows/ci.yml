name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (verifies the whole app compiles, using placeholder secrets)
        run: npm run build
        env:
          # These are dummy values purely so `next build` can statically
          # analyze/prerender pages that construct a Supabase client. Real
          # secrets live in Vercel's environment variables for deployment,
          # never in this repo or its CI logs.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          GEMINI_API_KEY: "placeholder-gemini-key"
          GOOGLE_CLIENT_ID: "placeholder-client-id"
          GOOGLE_CLIENT_SECRET: "placeholder-client-secret"
          GOOGLE_REDIRECT_URI: "http://localhost:3000/api/integrations/google-calendar/callback"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
